# Fly.io deployment config — see README.md "Hosting online" section.
# After `fly launch --no-deploy` generates its own fly.toml, replace it with
# this one (or merge the [[mounts]] and [http_service] blocks in), then
# adjust the `app` name below to whatever fly launch assigned you.

app = "swagat-ply-shop"
primary_region = "bom" # Mumbai — pick the fly region closest to the shop

[build]

[env]
  PORT = "3000"
  TZ = "Asia/Kolkata"

# Persistent disk so shop.db survives deploys and restarts.
[[mounts]]
  source = "shop_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # 512mb matches what the app already gets on Render. 256mb is cheaper and
  # probably enough (the process sits around 80mb idle), but an out-of-memory
  # kill lands at the billing counter mid-invoice, so this stays like-for-like
  # until there's a reason to trim it.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
