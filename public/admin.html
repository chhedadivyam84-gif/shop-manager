<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a4a">
<title>Admin Control Centre — Shop Manager</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<!-- style.css FIRST, for the shop's tokens, themes and component vocabulary;
     admin.css second, because it has to override a handful of bare-element
     rules style.css sets for the app's centred-column layout. -->
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/admin.css">
<!-- Blocking, so the shop's chosen theme is on <html> before first paint.
     Same file the app uses; it only reads the saved theme. -->
<script src="/js/boot.js"></script>
</head>
<body class="adm-body">

<!-- The app's own toast, reused as-is: a centred, width-capped message is
     correct here too, and #toast is the one id from the app this page wants.
     The inline display:none is copied from index.html and is load-bearing —
     style.css gives #toast position:fixed with a --danger background and no
     hidden state of its own, so without it the page opens with a red band
     across the top. (An inline STYLE is fine under this app's CSP; an
     inline SCRIPT is not.) -->
<div id="toast" style="display:none;"></div>

<!-- The app's own scrim, behind the drawer on tablet and phone. -->
<div class="scrim" id="adm-scrim"></div>

<div class="adm-shell" id="adm-shell">

  <!-- ============ SIDEBAR ============
       Fixed on laptop and desktop, a drawer below that. Collapsing to
       icons is a laptop/desktop affordance only — on a drawer there is
       nothing to reclaim. -->
  <aside class="adm-sidebar" id="adm-sidebar" aria-label="Admin sections">
    <div class="adm-brand">
      <span class="adm-brand-mark" aria-hidden="true">SM</span>
      <span class="adm-brand-text">
        <span class="adm-brand-name" id="adm-brand-name">Shop Manager</span>
        <span class="adm-brand-sub">Admin Control Centre</span>
      </span>
    </div>

    <!-- Built from GET /api/admin/me, never from a list held in the browser:
         the server decides what may appear, so nothing can be drawn here
         that the server would refuse to serve. -->
    <nav class="adm-nav" id="adm-nav" aria-label="Admin navigation"></nav>

    <div class="adm-sidebar-foot">
      <button type="button" class="adm-collapse-btn" id="adm-collapse"
              aria-expanded="true" aria-controls="adm-sidebar">
        <span class="adm-collapse-ic" aria-hidden="true"></span>
        <span class="adm-collapse-label">Collapse</span>
      </button>
    </div>
  </aside>

  <div class="adm-col">

    <!-- ============ TOP BAR ============ -->
    <header class="adm-topbar">
      <button type="button" class="adm-drawer-btn" id="adm-drawer-open"
              aria-label="Open admin menu" aria-expanded="false" aria-controls="adm-sidebar">
        <span aria-hidden="true"></span>
      </button>

      <div class="adm-crumb">
        <span class="adm-crumb-root">Admin</span>
        <span class="adm-crumb-sep" aria-hidden="true">/</span>
        <span class="adm-crumb-here" id="adm-crumb-here">Dashboard</span>
      </div>

      <div class="adm-search">
        <label class="adm-search-lbl" for="adm-search-input">Search</label>
        <input type="search" id="adm-search-input" class="adm-search-input"
               placeholder="Search the admin panel" autocomplete="off">
      </div>

      <div class="adm-topbar-actions">
        <button type="button" class="adm-icon-btn" id="adm-bell"
                aria-label="Notifications">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <path d="M10 2.6a4.4 4.4 0 0 0-4.4 4.4v3L4.2 12.6h11.6L14.4 10V7A4.4 4.4 0 0 0 10 2.6Z"/>
            <path d="M8.2 15.2a1.9 1.9 0 0 0 3.6 0"/>
          </svg>
        </button>

        <div class="adm-profile">
          <button type="button" class="adm-profile-btn" id="adm-profile-btn"
                  aria-expanded="false" aria-haspopup="true" aria-controls="adm-profile-menu">
            <span class="adm-avatar" id="adm-avatar" aria-hidden="true">—</span>
            <span class="adm-profile-text">
              <span class="adm-profile-name" id="adm-profile-name">&nbsp;</span>
              <span class="adm-profile-role" id="adm-profile-role">&nbsp;</span>
            </span>
          </button>
          <div class="adm-profile-menu" id="adm-profile-menu" role="menu" hidden>
            <a class="adm-profile-item" role="menuitem" href="/">Open Shop Manager</a>
            <button type="button" class="adm-profile-item" role="menuitem" id="adm-logout">Log out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- ============ WORKSPACE ============
         Deliberately not <main>: style.css gives the bare element the
         app's gutters, a 90px bottom-nav reserve and its own scroll
         container, none of which belong on a full-bleed workspace. -->
    <div class="adm-main" id="adm-main">
      <div class="adm-page" id="adm-page">
        <!-- Filled by admin.js. Every section in PART 1 is a placeholder. -->
      </div>
    </div>

  </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
